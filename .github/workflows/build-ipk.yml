name: Build OpenWrt BlockadeIP IPK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的提交 / 标签（留空则使用当前分支最新提交）'
        required: false
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
            file wget tar zstd

      - name: Download OpenWrt SDK
        run: |
          wget -O sdk.tar.zst https://downloads.openwrt.org/releases/24.10.0/targets/x86/64/openwrt-sdk-24.10.0-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update OpenWrt feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy packages into SDK
        run: |
          mkdir -p sdk/package/custom
          cp -r package/blockadeip sdk/package/custom/blockadeip
          cp -r package/luci-app-blockadeip sdk/package/custom/luci-app-blockadeip

      - name: Prepare SDK config
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_blockadeip=m" > .config
          echo "CONFIG_PACKAGE_luci-app-blockadeip=m" >> .config
          make defconfig

      - name: Build packages
        working-directory: sdk
        run: |
          make package/custom/blockadeip/compile V=s
          make package/custom/luci-app-blockadeip/compile V=s

      - name: Collect IPK files
        run: |
          mkdir -p artifact
          find sdk/bin/packages -name '*blockadeip*.ipk' -exec cp {} artifact/ \;
          ls -lah artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-blockadeip-ipk-x86_64-24.10.0
          path: artifact/*.ipk

      - name: Extract package version
        id: pkg
        run: |
          ver=$(grep -m1 '^PKG_VERSION:=' package/blockadeip/Makefile | cut -d= -f2 | tr -d ' ')
          rel=$(grep -m1 '^PKG_RELEASE:=' package/blockadeip/Makefile | cut -d= -f2 | tr -d ' ')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release_r=$rel" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: artifact/*.ipk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## BlockadeIP ${{ github.ref_name }}

            适用系统：OpenWrt / ImmortalWrt 24.10+（架构 `all`，x86_64 / ARM 通用）

            ```sh
            opkg install blockadeip_${{ steps.pkg.outputs.version }}-r${{ steps.pkg.outputs.release_r }}_all.ipk
            opkg install luci-app-blockadeip_${{ steps.pkg.outputs.version }}-r${{ steps.pkg.outputs.release_r }}_all.ipk
            /etc/init.d/blockadeip enable
            /etc/init.d/blockadeip start
            /etc/init.d/rpcd restart
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
